[package]
name = "hashforge"
version = "0.1.0"
edition = "2021"
authors = ["dev-forge team"]
description = "Universal multi-platform CLI & GUI cryptographic hashing utility for dev-forge"

[features]
default = ["gui"]
gui = ["dep:eframe"]

[dependencies]
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"], optional = true }
