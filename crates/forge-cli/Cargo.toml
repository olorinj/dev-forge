[package]
name = "dev-forge"
version = "0.1.0"
edition = "2021"
description = "Universal multi-language headless build forge orchestrator"
authors = ["dev-forge team"]

[[bin]]
name = "dev-forge"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
sysinfo = "0.33"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
directories = "6.0"
colored = "3.0"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }
