---
- name: Aprovisionamiento y optimización de forge-linux (Debian 12)
  hosts: all
  become: true
  vars:
    host_keyboard: "{{ host_keyboard | default('es') }}"
    rcodesign_version: "0.29.0"
    sccache_version: "0.8.2"
    gradle_version: "8.10.2"

  tasks:
    # -------------------------------------------------------------------------
    # 1. OPTIMIZACIÓN Y SERVICIOS MÍNIMOS
    # -------------------------------------------------------------------------
    - name: Deshabilitar servicios innecesarios para compilación headless
      ansible.builtin.service:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - bluetooth
        - cups
        - cups-browsed
        - avahi-daemon
        - ModemManager
      failed_when: false

    - name: Configurar parámetros sysctl para compilación de alto rendimiento
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: true
      loop:
        - { name: "vm.swappiness", value: "10" }
        - { name: "vm.vfs_cache_pressure", value: "50" }
        - { name: "vm.dirty_ratio", value: "15" }
        - { name: "vm.dirty_background_ratio", value: "5" }
        - { name: "kernel.pid_max", value: "4194304" }
        - { name: "kernel.threads-max", value: "65536" }
        - { name: "fs.file-max", value: "2097152" }
        - { name: "fs.nr_open", value: "2097152" }
        - { name: "fs.inotify.max_user_watches", value: "524288" }

    - name: Comprobar existencia de /swapfile
      ansible.builtin.stat:
        path: /swapfile
      register: stat_swapfile

    - name: Crear y activar swapfile de 4GB si no hay swap suficiente (< 3000MB)
      when: ansible_facts['memory_mb']['swap']['total'] < 3000 and not stat_swapfile.stat.exists
      block:
        - name: Crear archivo swapfile de 4GB
          ansible.builtin.command: fallocate -l 4G /swapfile
        - name: Ajustar permisos de swapfile
          ansible.builtin.file:
            path: /swapfile
            mode: '0600'
        - name: Formatear swapfile
          ansible.builtin.command: mkswap /swapfile
        - name: Activar swapfile
          ansible.builtin.command: /sbin/swapon /swapfile
        - name: Añadir swapfile persistente en fstab
          ansible.builtin.lineinfile:
            path: /etc/fstab
            line: '/swapfile none swap sw 0 0'
            state: present

    - name: Crear directorios de compilación y caché persistente
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: vagrant
        group: vagrant
        mode: '0775'
      loop:
        - /var/cache/ccache
        - /var/cache/sccache
        - /tmp/cargo-target
        - /opt/go
        - /tmp/go-cache

    - name: Configurar variables de entorno globales de compilación (/etc/profile.d/build-env.sh)
      ansible.builtin.copy:
        dest: /etc/profile.d/build-env.sh
        mode: '0755'
        content: |
          export TMPDIR=/tmp
          export CARGO_TARGET_DIR=/tmp/cargo-target
          export CARGO_BUILD_JOBS=2
          export CCACHE_DIR=/var/cache/ccache
          export SCCACHE_DIR=/var/cache/sccache
          if command -v sccache >/dev/null 2>&1; then
            export RUSTC_WRAPPER=sccache
          fi
          export GOPATH=/opt/go
          export GOCACHE=/tmp/go-cache
          export MAVEN_OPTS="-Xmx3584m -XX:+UseG1GC -Dfile.encoding=UTF-8"
          export GRADLE_OPTS="-Xmx3584m -Dorg.gradle.jvmargs=\"-Xmx3584m -XX:+UseG1GC\" -Dorg.gradle.parallel=true"
          export GIT_OPTIONAL_LOCKS=0

    - name: Asegurar que /tmp utiliza almacenamiento en disco y no tmpfs limitado a 2GB
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '.*[ \t]/tmp[ \t]tmpfs.*'
        state: absent

    - name: Desmontar tmpfs en /tmp si está montado
      ansible.builtin.command:
        cmd: umount -l /tmp
      failed_when: false
      changed_when: false

    - name: Configurar I/O scheduler óptimo para almacenamiento virtualizado (none)
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/60-virtualbox-iosched.rules
        owner: root
        group: root
        mode: '0644'
        content: |
          # Usar scheduler 'none' en discos virtuales para evitar overhead en el guest
          ACTION=="add|change", KERNEL=="sd[a-z]|vd[a-z]|nvme[0-9]*", ATTR{queue/scheduler}="none"

    - name: Instalar y configurar ZRAM comprimido con zstd (patrón tune-linux)
      block:
        - name: Instalar paquete zram-tools
          ansible.builtin.apt:
            pkg: zram-tools
            state: present

        - name: Configurar parámetros ZRAM (compresión zstd y 50% de RAM)
          ansible.builtin.copy:
            dest: /etc/default/zramswap
            owner: root
            group: root
            mode: '0644'
            content: |
              # Swap ultrarrápido comprimido en RAM (tune-linux)
              ALGO=zstd
              PERCENT=50
              PRIORITY=100

        - name: Habilitar y reiniciar servicio zramswap
          ansible.builtin.systemd:
            name: zramswap
            enabled: true
            state: restarted

    # -------------------------------------------------------------------------
    # 2. TECLADO Y LOCALIZACIÓN
    # -------------------------------------------------------------------------
    - name: Sincronizar distribución de teclado con la del host
      ansible.builtin.command:
        cmd: "localectl set-keymap {{ host_keyboard }}"
      failed_when: false
      changed_when: false

    # -------------------------------------------------------------------------
    # 3. REPOSITORIOS Y PAQUETES BASE
    # -------------------------------------------------------------------------
    - name: Instalar paquetes esenciales y dependencias de compilación
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        pkg:
          - curl
          - wget
          - git
          - cmake
          - ninja-build
          - build-essential
          - pkg-config
          - libssl-dev
          - ca-certificates
          - gnupg
          - software-properties-common
          - fuse3
          - libfuse3-3
          - mold
          - clang
          # Dependencias nativas para Tauri GUI y AppImage
          - libgtk-3-dev
          - libwebkit2gtk-4.1-dev
          - libayatana-appindicator3-dev
          - librsvg2-dev
          # Python y herramientas base
          - python3
          - python3-pip
          - python3-venv
          - python3-dev
          - pipx
          # Contenedores y virtualización
          - docker.io

    - name: Asegurar permisos de acceso a FUSE para AppImage
      ansible.builtin.file:
        path: /dev/fuse
        mode: '0666'

    - name: Configurar variables de entorno para AppImage y FUSE
      ansible.builtin.copy:
        dest: /etc/profile.d/appimage.sh
        content: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          export NO_STRIP=1
        mode: '0755'

    # -------------------------------------------------------------------------
    # 4. TOOLCHAIN DE RUST
    # -------------------------------------------------------------------------
    - name: Verificar instalación de rustup para vagrant
      ansible.builtin.stat:
        path: /home/vagrant/.cargo/bin/rustup
      register: rustup_stat

    - name: Instalar Rustup en usuario vagrant
      ansible.builtin.shell: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile default
      become_user: vagrant
      when: not rustup_stat.stat.exists

    - name: Añadir targets de compilación cruzada en Rust
      ansible.builtin.command:
        cmd: "/home/vagrant/.cargo/bin/rustup target add {{ item }}"
      become_user: vagrant
      loop:
        - x86_64-unknown-linux-gnu
        - x86_64-unknown-linux-musl
        - aarch64-unknown-linux-gnu
      failed_when: false

    - name: Configurar mold como enlazador predeterminado en Cargo
      ansible.builtin.copy:
        dest: /home/vagrant/.cargo/config.toml
        owner: vagrant
        group: vagrant
        mode: '0644'
        content: |
          [target.x86_64-unknown-linux-gnu]
          linker = "clang"
          rustflags = ["-C", "link-arg=-fuse-ld=mold"]

    - name: Instalar sccache para aceleración de compilación
      ansible.builtin.shell: |
        curl -sSL "https://github.com/mozilla/sccache/releases/download/v{{ sccache_version }}/sccache-v{{ sccache_version }}-x86_64-unknown-linux-musl.tar.gz" | tar xz -C /tmp
        mv "/tmp/sccache-v{{ sccache_version }}-x86_64-unknown-linux-musl/sccache" /usr/local/bin/
        chmod +x /usr/local/bin/sccache
        rm -rf /tmp/sccache*
      args:
        creates: /usr/local/bin/sccache

    - name: Instalar cargo-binstall para descargas precompiladas ultra-rápidas
      ansible.builtin.shell: |
        curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
        cp /home/vagrant/.cargo/bin/cargo-binstall /usr/local/bin/ 2>/dev/null || true
      become_user: vagrant
      args:
        creates: /home/vagrant/.cargo/bin/cargo-binstall

    - name: Instalar binario oficial precompilado de cargo-tauri (tauri-cli)
      ansible.builtin.shell: |
        /home/vagrant/.cargo/bin/cargo-binstall --no-confirm tauri-cli
        cp /home/vagrant/.cargo/bin/cargo-tauri /usr/local/bin/ 2>/dev/null || true
      become_user: vagrant
      args:
        creates: /home/vagrant/.cargo/bin/cargo-tauri

    - name: Configurar PATH global para Cargo
      ansible.builtin.copy:
        dest: /etc/profile.d/rust.sh
        content: |
          export PATH="/home/vagrant/.cargo/bin:$PATH"
          export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-/tmp/cargo-target}"
        mode: '0755'

    # -------------------------------------------------------------------------
    # 5. TOOLCHAIN DE PYTHON
    # -------------------------------------------------------------------------
    - name: Instalar herramientas modernas de Python (uv, poetry, pipenv, nuitka)
      ansible.builtin.shell: |
        pip3 install --break-system-packages --no-cache-dir uv poetry pipenv nuitka pyinstaller tox build wheel setuptools 2>/dev/null || true
      args:
        creates: /usr/local/bin/uv

    # -------------------------------------------------------------------------
    # 6. TOOLCHAIN DE GO
    # -------------------------------------------------------------------------
    - name: Instalar Go mediante APT
      ansible.builtin.apt:
        pkg:
          - golang-go

    # -------------------------------------------------------------------------
    # 7. TOOLCHAIN DE NODE.JS (LTS 20.x)
    # -------------------------------------------------------------------------
    - name: Añadir repositorio oficial de NodeSource 20.x
      ansible.builtin.shell: |
        curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      args:
        creates: /etc/apt/sources.list.d/nodesource.list

    - name: Instalar Node.js LTS
      ansible.builtin.apt:
        pkg:
          - nodejs

    # -------------------------------------------------------------------------
    # 8. TOOLCHAIN DE JAVA (OpenJDK 21 + Gradle)
    # -------------------------------------------------------------------------
    - name: Añadir clave y repositorio de Adoptium Eclipse Temurin
      ansible.builtin.shell: |
        wget -qO - https://packages.adoptium.net/artifactory/api/gpg/key/public | gpg --dearmor -o /etc/apt/trusted.gpg.d/adoptium.gpg
        echo "deb https://packages.adoptium.net/artifactory/deb bookworm main" > /etc/apt/sources.list.d/adoptium.list
        apt-get update -y
      args:
        creates: /etc/apt/sources.list.d/adoptium.list

    - name: Instalar Eclipse Temurin OpenJDK 21 LTS
      ansible.builtin.apt:
        pkg:
          - temurin-21-jdk

    - name: Instalar Gradle
      ansible.builtin.shell: |
        wget -q "https://services.gradle.org/distributions/gradle-{{ gradle_version }}-bin.zip" -O /tmp/gradle.zip
        unzip -q /tmp/gradle.zip -d /opt
        ln -sf "/opt/gradle-{{ gradle_version }}/bin/gradle" /usr/local/bin/gradle
        rm -f /tmp/gradle.zip
      args:
        creates: /usr/local/bin/gradle

    # -------------------------------------------------------------------------
    # 9. DOCKER Y HERRAMIENTAS PARA macOS (osxcross, rcodesign, dmgbuild)
    # -------------------------------------------------------------------------
    - name: Añadir usuario vagrant al grupo docker
      ansible.builtin.user:
        name: vagrant
        groups: docker
        append: true

    - name: Iniciar y habilitar servicio Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Instalar dmgbuild para empaquetado macOS DMG
      ansible.builtin.shell: |
        pip3 install --break-system-packages --no-cache-dir dmgbuild 2>/dev/null || true
      args:
        creates: /usr/local/bin/dmgbuild

    - name: Instalar rcodesign (Apple Code Signing & Notarization puro en Rust)
      ansible.builtin.shell: |
        R_URL="https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F{{ rcodesign_version }}/apple-codesign-{{ rcodesign_version }}-x86_64-unknown-linux-musl.tar.gz"
        curl -fsSL "$R_URL" -o /tmp/apple-codesign.tar.gz
        tar -C /tmp -xzf /tmp/apple-codesign.tar.gz
        cp "/tmp/apple-codesign-{{ rcodesign_version }}-x86_64-unknown-linux-musl/rcodesign" /usr/local/bin/
        chmod +x /usr/local/bin/rcodesign
        rm -rf /tmp/apple-codesign*
      args:
        creates: /usr/local/bin/rcodesign

